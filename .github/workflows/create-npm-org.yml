name: create-npm-org

# 一次性辅助：用 npm CLI 创建 @mombrane 组织（网页建 org 表单报错时的绕过方案）。
# 手动触发一次即可；成功后本 workflow 可从仓库删除。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Create @mombrane org and add self as owner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ME="$(npm whoami)"
          echo "authenticated npm user: ${ME}"
          npm org add mombrane "${ME}"
          echo "--- org members after creation ---"
          npm org ls mombrane

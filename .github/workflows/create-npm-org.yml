name: create-npm-org

# 一次性辅助：用 npm CLI 创建 @mombrane 组织（网页建 org 表单报错时的绕过方案）。
# 手动触发一次即可；成功后本 workflow 可从仓库删除。
on:
  workflow_dispatch:
    inputs:
      username:
        description: '你的 npm 用户名（将成为 org owner）'
        required: true

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Diagnose token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm whoami; then
            echo "::notice::token auth OK"
          else
            echo "::error::NPM_TOKEN 认证失败：请重新生成 Automation token 并更新 Secret"
            exit 1
          fi

      - name: Create @mombrane org and add owner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm org add mombrane "${{ github.event.inputs.username }}"
          echo "--- org members after creation ---"
          npm org ls mombrane
